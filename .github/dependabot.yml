version: 2
updates:
  # Maintain Rust / Cargo dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/New_York"
    # Consolidate updates into a single PR rather than one PR per crate
    groups:
      cargo-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions updates go to artcraft-launcher, the record of the ArtCraft Launcher code this
  # project started from, so its pull requests show what's new upstream. Never merge them there:
  # that branch stays the original record.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "artcraft-launcher"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/New_York"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"
