# DraftCraft Launcher catalog: the apps the launcher installs, updates and opens.
#
# Each app downloads only from its own pinned `repo`, and every download is checked against the
# release's SHA256SUMS.txt or, when a release has none, GitHub's own SHA-256 of the file.
# A new app here is the project owner's decision alone (AGENTS.md).

[[apps]]
id = "draftcraft"
name = "DraftCraft"
tagline = "2D CAD and drafting"
color = [31, 95, 175]
ink_light = [24, 74, 140]
ink_dark = [141, 184, 240]
kind = "official"
publisher = "D.E.V."
repo = "DraftCraft-DEV/DraftCraft"
site = "https://github.com/DraftCraft-DEV/DraftCraft"
# DraftCraft's Windows installer registers as "DraftCraft" by "Skryx Dev".
msi_publisher = "Skryx Dev"
# Its Linux desktop file, Flatpak and macOS bundle id.
bundle = "dev.skryx.draftcraft"
former_bundles = []
former_ids = []
former_names = []
mac_bundle_name = "DraftCraft"
[apps.details]
headline = "2D drafting with the ribbon you know."
about = "DraftCraft is an open-source CAD and drafting application with a Windows-style ribbon and AutoCAD's command names at its command line. It reads and writes DWG and DXF itself, in every version from AutoCAD 2000 to 2018.\n\nIt runs natively on Windows, macOS and Linux, and agents can drive it through MCP, a control channel and its command-line tool."
platforms = "Windows, macOS, Linux, web"
[[apps.details.features]]
title = "DWG and DXF"
text = "Opens and saves DWG and DXF with its own code, in every version from AutoCAD 2000 to 2018."
[[apps.details.features]]
title = "The ribbon you know"
text = "A Windows-style ribbon, and the command names you already type."
[[apps.details.features]]
title = "Drafting tools"
text = "Dimensions, hatches, blocks with attributes, layouts and plotting to PDF."
[[apps.details.features]]
title = "Agents welcome"
text = "MCP, a control channel and a command-line tool all run the same commands."

[[apps]]
id = "tracedraw"
name = "TraceDraw"
tagline = "Vector illustration and page layout"
color = [123, 92, 255]
ink_light = [92, 63, 214]
ink_dark = [183, 165, 255]
kind = "community"
publisher = "TraceDraw"
repo = "tracedraw/tracedraw"
site = "https://github.com/tracedraw/tracedraw"
# TraceDraw's Windows installer registers as "TraceDraw" by "TraceDraw".
msi_publisher = "TraceDraw"
bundle = "dev.tracedraw.app"
former_bundles = []
former_ids = []
former_names = []
mac_bundle_name = "TraceDraw"
[apps.details]
headline = "Vector illustration, page layout and print."
about = "TraceDraw is an open-source vector editor written in Rust, made by the TraceDraw contributors. It has pages and layers, curves and nodes, text, fills and outlines, live effects and symbols, and it prints to PDF/X.\n\nThe launcher installs TraceDraw's official releases as its makers publish them."
platforms = "Windows, macOS, Linux, web"
[[apps.details.features]]
title = "Pages and layers"
text = "Documents of several pages, each with its layers."
[[apps.details.features]]
title = "Curves and text"
text = "Curves and nodes, artistic and paragraph text, fills and outlines."
[[apps.details.features]]
title = "Print"
text = "PDF/X output for print."
[[apps.details.features]]
title = "Opens .cdr files"
text = "Reads .cdr drawings, implemented independently for interoperability."
